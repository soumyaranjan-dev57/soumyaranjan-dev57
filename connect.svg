
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#111b3d"/>
      <stop offset="100%" stop-color="#241044"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#287dff"/>
      <stop offset="100%" stop-color="#b45cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#43d9ff" stroke-opacity=".1"/>
    </pattern>
    <style>
      .moving {
        stroke-dasharray: 90 910;
        animation: travel 5s linear infinite;
      }
      .orbit {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 10s linear infinite;
      }
      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes travel {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%,100% { opacity: .45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="430" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="430" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="994" height="424" rx="16"
        fill="none" stroke="url(#neon)" stroke-width="3"/>
  <rect x="3" y="3" width="994" height="424" rx="16"
        fill="none" stroke="#00f5ff" stroke-width="2" class="moving"/>

  <text x="38" y="47" fill="#00f5ff" font-family="monospace"
        font-size="15" letter-spacing="3">04 // CONNECT</text>
  <text x="38" y="91" fill="#ffffff" font-family="monospace"
        font-size="27" font-weight="bold">LET'S CONNECT</text>
  <path d="M38 111H962" stroke="url(#neon)" stroke-width="1.5"/>
  <path d="M38 111H962" stroke="#00f5ff" stroke-width="3"
        opacity=".9" class="moving"/>

  <text x="500" y="151" fill="#d8e8ff" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="17">
    Happy to connect about software engineering,
  </text>
  <text x="500" y="177" fill="#67f7ff" text-anchor="middle"
        font-family="Arial,sans-serif" font-size="18" font-weight="bold">
    DevOps, cloud and AI.
  </text>

