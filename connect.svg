    <rect x="520" y="211" width="435" height="125" rx="14"
          fill="#071426" fill-opacity=".8" stroke="url(#neon)" stroke-width="2"/>
    <rect x="520" y="211" width="435" height="125" rx="14"
          fill="none" stroke="#b45cff" stroke-width="2" class="moving"/>
    <circle cx="584" cy="273" r="37" fill="none"
