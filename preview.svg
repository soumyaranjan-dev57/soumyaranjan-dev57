<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">NEON SERPENT arcade game</title><desc id="desc">A neon cyber arcade banner linking to a playable snake game.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#10163a"/><stop offset="1" stop-color="#260b3b"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".55" stop-color="#7b61ff"/><stop offset="1" stop-color="#ff39d4"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#1b6a9c" stroke-opacity=".45" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)" opacity=".8"/>
<rect x="12" y="12" width="1176" height="336" rx="18" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".9"/>
<g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
 <path d="M760 115 H900 V175 H1020 V235 H900 V295 H780"/>
</g>
<g fill="#f5ffff" filter="url(#glow)"><circle cx="760" cy="115" r="7"/><circle cx="1020" cy="235" r="7"/><path d="M1080 70l10 20 22 3-16 15 4 22-20-11-20 11 4-22-16-15 22-3z" fill="#ff39d4"/></g>
<g font-family="ui-monospace,Menlo,Consolas,monospace"><text x="68" y="83" fill="#00f5ff" font-size="17" letter-spacing="6">SRB // ARCADE SYSTEM 03</text>
<text x="64" y="160" fill="#f5fbff" font-size="59" font-weight="900" letter-spacing="1">NEON SERPENT</text>
<text x="68" y="202" fill="#b8c8ed" font-size="18" letter-spacing="3">3D-STYLE SNAKE ARCADE</text>
<rect x="68" y="244" width="250" height="52" rx="12" fill="url(#neon)"/><text x="193" y="277" fill="#050816" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="2">▶ PLAY THE GAME</text>
<text x="68" y="326" fill="#8ba8d0" font-size="12" letter-spacing="2">COLLECT • GROW • SURVIVE</text></g>
</svg>
