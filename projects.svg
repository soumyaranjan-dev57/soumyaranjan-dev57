
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="55%" stop-color="#111b3d"/>
      <stop offset="100%" stop-color="#241044"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#287dff"/>
      <stop offset="100%" stop-color="#b45cff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#43d9ff" stroke-opacity=".09"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .light {
        stroke-dasharray: 70 930;
        animation: travel 5s linear infinite;
      }
      .orbit {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 9s linear infinite;
      }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes travel {
        from { stroke-dashoffset: 1000; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%,100% { opacity: .45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1000" height="650" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="650" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="994" height="644" rx="16"
        fill="none" stroke="url(#neon)" stroke-width="2.5"/>

  <path d="M35 70H965" stroke="url(#neon)" stroke-width="1.5"/>
  <path d="M35 70H965" stroke="#00f5ff" stroke-width="3"
        opacity=".9" filter="url(#glow)" class="light"/>

  <text x="38" y="43" fill="#00f5ff" font-family="monospace"
        font-size="15" letter-spacing="3">03 // PROJECTS</text>
  <text x="965" y="43" fill="#9bb8ff" text-anchor="end"
        font-family="monospace" font-size="11">BUILD • TEST • AUTOMATE</text>

  <!-- Project one -->
  <rect x="30" y="92" width="940" height="220" rx="13"
        fill="#071426" fill-opacity=".78" stroke="url(#neon)" stroke-width="1.5"/>
  <rect x="30" y="92" width="940" height="220" rx="13"
        fill="none" stroke="#00f5ff" stroke-width="2"
        opacity=".8" class="light"/>

  <rect x="49" y="113" width="112" height="112" rx="12"
        fill="#0a1d3b" stroke="url(#neon)" stroke-width="2"/>
  <circle cx="105" cy="169" r="36" fill="none"
          stroke="#00f5ff" stroke-width="2" opacity=".35" class="orbit"/>
  <circle cx="105" cy="169" r="25" fill="none"
          stroke="#b45cff" stroke-width="1.5" stroke-dasharray="6 7" class="orbit"/>
  <g fill="none" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M79 161L94 149L109 161V182H79Z"/>
    <path d="M85 170H103M85 176H103"/>
    <ellipse cx="125" cy="180" rx="10" ry="4"/>
    <path d="M115 180V194C115 199 135 199 135 194V180M115 187C115 192 135 192 135 187"/>
  </g>
  <circle cx="145" cy="123" r="4" fill="#42ffb0" filter="url(#glow)" class="pulse"/>

  <text x="184" y="127" fill="#67f7ff" font-family="monospace"
        font-size="20" font-weight="bold">flask-mysql-docker-compose</text>
  <rect x="184" y="143" width="148" height="25" rx="12"
        fill="#063b42" stroke="#00e5c4"/>
  <text x="258" y="160" fill="#42ffcf" text-anchor="middle"
        font-family="monospace" font-size="10">PRACTICE PROJECT</text>
  <text x="345" y="160" fill="#b9c8e8" font-family="monospace" font-size="11">
    PYTHON • FLASK • MYSQL • COMPOSE
  </text>

  <text x="184" y="192" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="14">
    A Flask app and MySQL database running in separate containers.
  </text>
  <circle cx="190" cy="216" r="3" fill="#00f5ff"/>
  <text x="203" y="220" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
    Flask and MySQL 8.4 served with Gunicorn
  </text>
  <circle cx="190" cy="240" r="3" fill="#00f5ff"/>
  <text x="203" y="244" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
    Docker network, health checks and persistent named volume
  </text>
  <circle cx="190" cy="264" r="3" fill="#00f5ff"/>
  <text x="203" y="268" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
    Environment-based credentials and non-root app user
  </text>

  <path d="M184 286H950" stroke="url(#neon)" opacity=".4"/>
  <text x="947" y="301" text-anchor="end" fill="#00f5ff"
        font-family="monospace" font-size="11">01 / CONTAINERS + DATABASE</text>

  <!-- Project two -->
  <rect x="30" y="330" width="940" height="275" rx="13"
        fill="#071426" fill-opacity=".78" stroke="url(#neon)" stroke-width="1.5"/>
  <rect x="30" y="330" width="940" height="275" rx="13"
        fill="none" stroke="#b45cff" stroke-width="2"
        opacity=".8" class="light"/>

  <rect x="49" y="351" width="112" height="112" rx="12"
        fill="#0a1d3b" stroke="url(#neon)" stroke-width="2"/>
  <circle cx="105" cy="407" r="36" fill="none"
          stroke="#b45cff" stroke-width="2" opacity=".35" class="orbit"/>
  <circle cx="105" cy="407" r="25" fill="none"
          stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="6 7" class="orbit"/>
  <g fill="none" stroke="#67dfff" stroke-width="3" stroke-linejoin="round">
    <path d="M78 390L105 376L132 390L105 404Z"/>
    <path d="M82 401L105 413L128 401M82 411L105 423L128 411"/>
  </g>
  <circle cx="145" cy="361" r="4" fill="#42ffb0" filter="url(#glow)" class="pulse"/>

  <text x="184" y="366" fill="#67f7ff" font-family="monospace"
        font-size="21" font-weight="bold">two-tier-flask-app</text>
  <rect x="184" y="383" width="128" height="25" rx="12"
        fill="#281746" stroke="#b45cff"/>
  <text x="248" y="400" fill="#d2a5ff" text-anchor="middle"
        font-family="monospace" font-size="10">PRACTICE FORK</text>
  <text x="325" y="400" fill="#b9c8e8" font-family="monospace" font-size="11">
    FLASK • MYSQL • DOCKER • JENKINS
  </text>

  <text x="184" y="432" fill="#d8e8ff" font-family="Arial, sans-serif" font-size="14">
    Open-source two-tier Flask + MySQL demo for practical learning.
  </text>
  <circle cx="190" cy="459" r="3" fill="#00f5ff"/>
  <text x="203" y="463" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
    Flask and MySQL run together using Docker Compose
  </text>
  <circle cx="190" cy="485" r="3" fill="#00f5ff"/>
  <text x="203" y="489" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
    Jenkinsfile for pipeline stages and Docker image builds
  </text>
  <circle cx="190" cy="511" r="3" fill="#00f5ff"/>
  <text x="203" y="515" fill="#a9c7f5" font-family="Arial, sans-serif" font-size="12">
