  </text>

  <path d="M184 558H950" stroke="url(#neon)" opacity=".4"/>
  <text x="947" y="580" text-anchor="end" fill="#bda4ff"
        font-family="monospace" font-size="11">02 / CI-CD PRACTICE</text>

  <circle cx="44" cy="625" r="4" fill="#42ffb0" filter="url(#glow)" class="pulse"/>
  <text x="57" y="630" fill="#8da8c9" font-family="monospace" font-size="10">
    LEARNING BY BUILDING // PROJECTS AND LABS
  </text>
  <text x="965" y="630" fill="#00f5ff" text-anchor="end"
        font-family="monospace" font-size="10">SRB / 2026</text>
</svg>
